events {
    worker_connections 1024;
}

http {
    upstream techsolutions_backend_cluster {
        server backend_node1:8081 max_fails=2 fail_timeout=5s;
        server backend_node2:8081 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://techsolutions_backend_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}